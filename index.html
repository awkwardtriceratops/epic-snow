<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Epic Snow</title>
  <meta name="description" content="16-day snow forecasts, snowpack and mountain cams for every Epic Pass mountain.">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M16 5v22M6.5 10.5l19 11M6.5 21.5l19-11' stroke='%237cc4ff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a href="#/" class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v24M5.6 10l20.8 12M5.6 22l20.8-12" /></svg>
      <span>Epic Snow</span>
    </a>
    <span id="updated" class="updated"></span>
  </header>
  <main id="app"><p class="loading">Loading forecasts…</p></main>
  <dialog id="camModal">
    <div class="modal-head"><strong id="camTitle"></strong><button id="camClose" aria-label="Close">✕</button></div>
    <div class="modal-body"><iframe id="camFrame" allow="autoplay; fullscreen" allowfullscreen title="Live cam"></iframe></div>
  </dialog>
  <footer class="foot">
    Forecasts: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (ECMWF, GFS, HRRR, GEM, ICON blend), downscaled to upper-mountain elevation with temperature-based snow ratios.
    Snowpack: <a href="https://www.nrcs.usda.gov/wps/portal/wcc/home/" target="_blank" rel="noopener">USDA SNOTEL</a> nearest station.
    Cams: resort feeds via Brown Rice. Updated every 2 hours. Not affiliated with Vail Resorts.
  </footer>
  <script src="app.js"></script>
</body>
</html>
