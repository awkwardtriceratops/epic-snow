name: Update snow data and deploy

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-snow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch forecasts and snowpack
        run: node scripts/update.mjs
      - name: Commit data
        run: |
          git config user.name "snow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snow.json
          if ! git diff --cached --quiet; then
            git commit -m "Update snow data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
